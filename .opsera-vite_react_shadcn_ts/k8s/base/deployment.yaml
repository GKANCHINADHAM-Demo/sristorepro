apiVersion: apps/v1
kind: Deployment
metadata:
  name: vite-react-shadcn-ts
  labels:
    app: vite-react-shadcn-ts
    managed-by: opsera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vite-react-shadcn-ts
  template:
    metadata:
      labels:
        app: vite-react-shadcn-ts
    spec:
      containers:
        - name: app
          image: APP_IMAGE
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
