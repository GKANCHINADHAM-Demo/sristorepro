apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vite-react-shadcn-ts
  labels:
    app: vite-react-shadcn-ts
spec:
  podSelector:
    matchLabels:
      app: vite-react-shadcn-ts
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress-nginx namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for external API calls
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
