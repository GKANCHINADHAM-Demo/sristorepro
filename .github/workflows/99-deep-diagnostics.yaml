name: 99 - Deep Diagnostics and Fix

on:
  workflow_dispatch:

env:
  APP_NAME: vite-react-shadcn-ts
  AWS_REGION: us-west-2

jobs:
  diagnose:
    name: Deep Diagnostics
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          ALL_CLUSTERS=$(aws eks list-clusters --region ${{ env.AWS_REGION }} --query 'clusters[]' --output text)
          HUB_CLUSTER=$(echo "$ALL_CLUSTERS" | tr '\t' '\n' | grep -i "argocd" | head -1)
          aws eks update-kubeconfig --name $HUB_CLUSTER --region ${{ env.AWS_REGION }}

      - name: Check cert-manager installation cluster-wide
        run: |
          echo "=== cert-manager namespace ==="
          kubectl get namespace cert-manager 2>&1 || echo "No cert-manager namespace"

          echo ""
          echo "=== cert-manager CRDs ==="
          kubectl get crd | grep cert-manager 2>&1 || echo "No cert-manager CRDs"

          echo ""
          echo "=== cert-manager deployments in all namespaces ==="
          kubectl get deployment -A | grep cert-manager 2>&1 || echo "No cert-manager deployments"

          echo ""
          echo "=== ClusterIssuers ==="
          kubectl get clusterissuer 2>&1 || echo "No ClusterIssuer CRD"

      - name: Check friend's app namespace
        run: |
          echo "=== Checking opsera-plan-and-joy namespace ==="
          FRIEND_NS=$(kubectl get namespace | grep "plan-and-joy\|planjoy\|plan_and_joy" | awk '{print $1}' | head -1)

          if [ -n "$FRIEND_NS" ]; then
            echo "Found namespace: $FRIEND_NS"
            echo ""
            echo "=== Friend's Ingress ==="
            kubectl get ingress -n $FRIEND_NS -o yaml

            echo ""
            echo "=== Friend's Ingress Annotations ==="
            kubectl get ingress -n $FRIEND_NS -o jsonpath='{.items[*].metadata.annotations}' | jq '.'

            echo ""
            echo "=== Friend's TLS Secrets ==="
            kubectl get secret -n $FRIEND_NS | grep tls || echo "No TLS secrets found"

            echo ""
            echo "=== Friend's Services ==="
            kubectl get service -n $FRIEND_NS
          else
            echo "Could not find friend's namespace"
          fi

      - name: Check all ingresses in cluster
        run: |
          echo "=== All Ingresses in Cluster ==="
          kubectl get ingress -A

          echo ""
          echo "=== Ingresses using Let's Encrypt ==="
          kubectl get ingress -A -o yaml | grep -A 5 "letsencrypt\|cert-manager"

      - name: Check AWS Load Balancer Controller detailed logs
        run: |
          echo "=== AWS LB Controller Pods ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller

          echo ""
          echo "=== AWS LB Controller Full Logs (last 200 lines) ==="
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=200

          echo ""
          echo "=== Filtered: Certificate and TLS Related ==="
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=200 | grep -i "certificate\|tls\|ssl\|acm" || echo "No certificate-related logs"

          echo ""
          echo "=== Filtered: Our App Specific ==="
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=200 | grep -i "vite-react-shadcn-ts" || echo "No logs for our app"

      - name: Check our ingress current state
        run: |
          APP_NS="${{ env.APP_NAME }}-dev"

          echo "=== Our Ingress ==="
          kubectl get ingress ${{ env.APP_NAME }} -n $APP_NS -o yaml

          echo ""
          echo "=== Our Ingress Events ==="
          kubectl get events -n $APP_NS --field-selector involvedObject.kind=Ingress --sort-by='.lastTimestamp' | tail -20

      - name: Check actual ALB configuration in AWS
        run: |
          APP_NS="${{ env.APP_NAME }}-dev"

          echo "=== Getting ALB ARN from Ingress ==="
          ALB_ADDRESS=$(kubectl get ingress ${{ env.APP_NAME }} -n $APP_NS -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ALB Address: $ALB_ADDRESS"

          if [ -n "$ALB_ADDRESS" ]; then
            echo ""
            echo "=== Finding ALB in AWS ==="
            ALB_ARN=$(aws elbv2 describe-load-balancers --region ${{ env.AWS_REGION }} --query "LoadBalancers[?DNSName=='$ALB_ADDRESS'].LoadBalancerArn" --output text)
            echo "ALB ARN: $ALB_ARN"

            if [ -n "$ALB_ARN" ]; then
              echo ""
              echo "=== ALB Listeners ==="
              aws elbv2 describe-listeners --load-balancer-arn $ALB_ARN --region ${{ env.AWS_REGION }}

              echo ""
              echo "=== HTTPS Listener Certificates ==="
              LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn $ALB_ARN --region ${{ env.AWS_REGION }} --query 'Listeners[?Protocol==`HTTPS`].ListenerArn' --output text)
              if [ -n "$LISTENER_ARN" ]; then
                aws elbv2 describe-listener-certificates --listener-arn $LISTENER_ARN --region ${{ env.AWS_REGION }}
              else
                echo "No HTTPS listener found"
              fi
            fi
          fi

      - name: Test both endpoints
        run: |
          echo "=== Testing Friend's App (working) ==="
          curl -I https://opsera-plan-and-joy-dev.agent.opsera.dev 2>&1 | head -15

          echo ""
          echo "=== Testing Our App ==="
          curl -I -k https://vite-react-shadcn-ts-dev.agent.opsera.dev 2>&1 | head -15

          echo ""
          echo "=== Certificate Details for Friend's App ==="
          echo | openssl s_client -servername opsera-plan-and-joy-dev.agent.opsera.dev -connect opsera-plan-and-joy-dev.agent.opsera.dev:443 2>/dev/null | openssl x509 -noout -text | grep -A 2 "Issuer\|Subject\|Not"

          echo ""
          echo "=== Certificate Details for Our App ==="
          echo | openssl s_client -servername vite-react-shadcn-ts-dev.agent.opsera.dev -connect vite-react-shadcn-ts-dev.agent.opsera.dev:443 2>/dev/null | openssl x509 -noout -text | grep -A 2 "Issuer\|Subject\|Not"
