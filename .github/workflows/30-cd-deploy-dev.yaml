name: 30 - Deploy to DEV

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag (7-char SHA or version)'
        required: true
        type: string

env:
  APP_NAME: vite-react-shadcn-ts
  ENVIRONMENT: dev
  AWS_REGION: us-west-2
  TENANT: gayathrikanchinadham

jobs:
  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: dev
      url: https://${{ env.APP_NAME }}-dev.agents.opsera.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Kustomize image tag
        run: |
          cd .opsera-vite_react_shadcn_ts/k8s/overlays/dev

          # Update kustomization.yaml with new image tag
          cat > kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          namespace: ${{ env.APP_NAME }}-dev

          resources:
            - ../../base

          images:
            - name: APP_IMAGE
              newName: ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}
              newTag: ${{ inputs.image_tag }}

          replicas:
            - name: ${{ env.APP_NAME }}
              count: 1
          EOF

          echo "✓ Updated image tag to: ${{ inputs.image_tag }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .opsera-vite_react_shadcn_ts/k8s/overlays/dev/kustomization.yaml
          git commit -m "Deploy ${{ env.APP_NAME }} to DEV: ${{ inputs.image_tag }}"
          git push

          echo "✓ Pushed changes to trigger ArgoCD sync"

      - name: Discover and configure kubectl
        id: kubectl-setup
        run: |
          echo "🔍 Discovering EKS clusters in region: ${{ env.AWS_REGION }}"
          echo ""

          # List all EKS clusters in the region
          ALL_CLUSTERS=$(aws eks list-clusters --region ${{ env.AWS_REGION }} --query 'clusters[]' --output text)

          if [ -z "$ALL_CLUSTERS" ]; then
            echo "⚠ No EKS clusters found in region ${{ env.AWS_REGION }}"
            echo "cluster_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Available clusters:"
          echo "$ALL_CLUSTERS"
          echo ""

          # Try to find cluster matching pattern: {tenant}-{region-short}-{env}
          REGION_SHORT=$(echo "${{ env.AWS_REGION }}" | sed 's/us-west-2/usw2/;s/us-east-1/use1/;s/eu-west-1/euw1/')
          CLUSTER_PATTERN="${{ env.TENANT }}-${REGION_SHORT}"

          echo "Searching for cluster matching pattern: $CLUSTER_PATTERN*"
          echo ""

          FOUND_CLUSTER=""
          for cluster in $ALL_CLUSTERS; do
            if [[ "$cluster" == *"$CLUSTER_PATTERN"* ]]; then
              FOUND_CLUSTER="$cluster"
              echo "✓ Found matching cluster: $FOUND_CLUSTER"
              break
            fi
          done

          # If no pattern match, use first cluster
          if [ -z "$FOUND_CLUSTER" ]; then
            FOUND_CLUSTER=$(echo "$ALL_CLUSTERS" | awk '{print $1}')
            echo "⚠ No pattern match found, using first available cluster: $FOUND_CLUSTER"
          fi

          echo ""
          echo "🔧 Configuring kubectl for cluster: $FOUND_CLUSTER"

          # Update kubeconfig
          aws eks update-kubeconfig --name $FOUND_CLUSTER --region ${{ env.AWS_REGION }}

          echo "✓ kubectl configured successfully"
          echo "cluster_found=true" >> $GITHUB_OUTPUT
          echo "cluster_name=$FOUND_CLUSTER" >> $GITHUB_OUTPUT

      - name: Verify ArgoCD application exists
        if: steps.kubectl-setup.outputs.cluster_found == 'true'
        run: |
          echo "🔍 Checking if ArgoCD application exists..."
          echo "Cluster: ${{ steps.kubectl-setup.outputs.cluster_name }}"
          echo ""

          APP_NAME="vite-react-shadcn-ts-dev"

          if kubectl get application $APP_NAME -n argocd 2>/dev/null; then
            echo "✓ ArgoCD application '$APP_NAME' exists"

            echo ""
            echo "📊 Application Details:"
            kubectl get application $APP_NAME -n argocd -o yaml | grep -A 5 "status:" || true

          else
            echo "⚠ ArgoCD application '$APP_NAME' NOT found!"
            echo "Please apply: kubectl apply -f .opsera-vite_react_shadcn_ts/argocd/application-dev.yaml"
            echo ""
            echo "Available applications:"
            kubectl get applications -n argocd || echo "No applications found"
          fi

      - name: Trigger and monitor ArgoCD sync
        if: steps.kubectl-setup.outputs.cluster_found == 'true'
        run: |
          echo "🔄 Triggering ArgoCD sync..."

          APP_NAME="vite-react-shadcn-ts-dev"

          # Check if app exists first
          if kubectl get application $APP_NAME -n argocd 2>/dev/null; then

            # Trigger refresh/sync
            echo "Refreshing application..."
            kubectl patch application $APP_NAME -n argocd --type merge -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' || true

            echo ""
            echo "⏳ Waiting for sync to start (10 seconds)..."
            sleep 10

            # Check sync status
            echo ""
            echo "📊 Sync Status:"
            kubectl get application $APP_NAME -n argocd -o jsonpath='{.status.sync.status}' && echo ""

            echo ""
            echo "🏥 Health Status:"
            kubectl get application $APP_NAME -n argocd -o jsonpath='{.status.health.status}' && echo ""

            echo ""
            echo "📝 Sync Summary:"
            kubectl describe application $APP_NAME -n argocd | grep -A 10 "Status:" || true

          else
            echo "⚠ Skipping - ArgoCD application not found"
          fi

      - name: Wait for deployment rollout
        if: steps.kubectl-setup.outputs.cluster_found == 'true'
        run: |
          echo "⏳ Waiting for deployment rollout (max 3 minutes)..."

          NAMESPACE="vite-react-shadcn-ts-dev"
          DEPLOYMENT="vite-react-shadcn-ts"

          # Check if namespace exists
          if kubectl get namespace $NAMESPACE 2>/dev/null; then
            echo "✓ Namespace '$NAMESPACE' exists"

            # Check if deployment exists
            if kubectl get deployment $DEPLOYMENT -n $NAMESPACE 2>/dev/null; then
              echo "✓ Deployment '$DEPLOYMENT' exists"

              # Wait for rollout with timeout
              kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=180s || true

            else
              echo "⚠ Deployment '$DEPLOYMENT' not found in namespace '$NAMESPACE'"
              echo "Available deployments:"
              kubectl get deployments -n $NAMESPACE || echo "No deployments found"
            fi

          else
            echo "⚠ Namespace '$NAMESPACE' does not exist yet"
            echo "Available namespaces:"
            kubectl get namespaces | grep vite || echo "No matching namespaces"
          fi

      - name: Verify deployment status
        if: steps.kubectl-setup.outputs.cluster_found == 'true'
        run: |
          echo "🔍 Comprehensive Deployment Verification"
          echo "========================================"

          NAMESPACE="vite-react-shadcn-ts-dev"
          DEPLOYMENT="vite-react-shadcn-ts"

          echo ""
          echo "## 1. Namespace Status"
          kubectl get namespace $NAMESPACE 2>/dev/null || echo "⚠ Namespace not found"

          echo ""
          echo "## 2. Deployment Status"
          kubectl get deployment $DEPLOYMENT -n $NAMESPACE 2>/dev/null || echo "⚠ Deployment not found"

          echo ""
          echo "## 3. ReplicaSets"
          kubectl get rs -n $NAMESPACE -l app=vite-react-shadcn-ts 2>/dev/null || echo "⚠ No replicasets"

          echo ""
          echo "## 4. Pods Status"
          kubectl get pods -n $NAMESPACE -l app=vite-react-shadcn-ts 2>/dev/null || echo "⚠ No pods found"

          echo ""
          echo "## 5. Pod Details"
          kubectl describe pods -n $NAMESPACE -l app=vite-react-shadcn-ts 2>/dev/null | grep -A 3 "Status:\|Conditions:\|Events:" || echo "⚠ No pod details"

          echo ""
          echo "## 6. Recent Pod Logs"
          POD_NAME=$(kubectl get pods -n $NAMESPACE -l app=vite-react-shadcn-ts -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$POD_NAME" ]; then
            echo "Latest logs from pod: $POD_NAME"
            kubectl logs $POD_NAME -n $NAMESPACE --tail=20 2>/dev/null || echo "⚠ Could not fetch logs"
          else
            echo "⚠ No pods running yet"
          fi

      - name: Verify service and ingress
        if: steps.kubectl-setup.outputs.cluster_found == 'true'
        run: |
          echo "🌐 Network Configuration Verification"
          echo "===================================="

          NAMESPACE="vite-react-shadcn-ts-dev"

          echo ""
          echo "## 1. Service Status"
          kubectl get service vite-react-shadcn-ts -n $NAMESPACE 2>/dev/null || echo "⚠ Service not found"

          echo ""
          echo "## 2. Service Details"
          kubectl describe service vite-react-shadcn-ts -n $NAMESPACE 2>/dev/null | grep -A 10 "Endpoints:" || echo "⚠ No service details"

          echo ""
          echo "## 3. Ingress Status"
          kubectl get ingress vite-react-shadcn-ts -n $NAMESPACE 2>/dev/null || echo "⚠ Ingress not found"

          echo ""
          echo "## 4. Ingress Details"
          kubectl describe ingress vite-react-shadcn-ts -n $NAMESPACE 2>/dev/null | grep -A 5 "Rules:\|TLS:\|Events:" || echo "⚠ No ingress details"

          echo ""
          echo "## 5. TLS Certificate Status"
          kubectl get certificate -n $NAMESPACE 2>/dev/null || echo "⚠ No certificates found"

          echo ""
          echo "## 6. Ingress Controller Logs (last 10 lines)"
          kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=10 2>/dev/null || echo "⚠ Could not fetch ingress logs"

      - name: Test endpoint availability
        run: |
          echo "🧪 Testing Endpoint Availability"
          echo "==============================="

          ENDPOINT="https://vite-react-shadcn-ts-dev.agents.opsera.dev"

          echo ""
          echo "Endpoint: $ENDPOINT"
          echo ""

          # Try health check endpoint
          echo "Testing health endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $ENDPOINT/health --max-time 10 || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check PASSED - Status: $HTTP_CODE"
          else
            echo "⚠ Health check returned: $HTTP_CODE"
          fi

          echo ""
          echo "Testing main endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $ENDPOINT --max-time 10 || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Main endpoint PASSED - Status: $HTTP_CODE"
          else
            echo "⚠ Main endpoint returned: $HTTP_CODE"
            echo ""
            echo "This is normal if DNS/ingress is still propagating (can take 2-5 minutes)"
          fi

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment to DEV Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **DEV** |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`vite-react-shadcn-ts-dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | \`vite-react-shadcn-ts\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 Application Endpoint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### **[https://vite-react-shadcn-ts-dev.agents.opsera.dev](https://vite-react-shadcn-ts-dev.agents.opsera.dev)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Health Check: https://vite-react-shadcn-ts-dev.agents.opsera.dev/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Quick Status Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Check pods" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get pods -n vite-react-shadcn-ts-dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Check ingress" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get ingress -n vite-react-shadcn-ts-dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# View logs" >> $GITHUB_STEP_SUMMARY
          echo "kubectl logs -n vite-react-shadcn-ts-dev -l app=vite-react-shadcn-ts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔍 ArgoCD Monitoring" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# View ArgoCD application status" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get application vite-react-shadcn-ts-dev -n argocd" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Access ArgoCD UI" >> $GITHUB_STEP_SUMMARY
          echo "kubectl port-forward svc/argocd-server -n argocd 8080:443" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
