name: 99 - Check Working App Kustomize

on:
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  check:
    name: Check Kustomize Config
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to spoke cluster
        run: |
          aws eks update-kubeconfig --name opsera-usw2-np --region us-west-2

      - name: Get working app deployment image
        run: |
          echo "=== Working App Deployment Image ==="
          kubectl get deployment plan-and-joy -n plan-and-joy-dev -o jsonpath='{.spec.template.spec.containers[0].image}' && echo ""

      - name: Get our app deployment image
        run: |
          echo "=== Our App Deployment Image (Current) ==="
          kubectl get deployment vite-react-shadcn-ts -n vite-react-shadcn-ts-dev -o jsonpath='{.spec.template.spec.containers[0].image}' && echo ""

      - name: Describe pod error
        run: |
          echo "=== Pod Events and Error Details ==="
          kubectl describe pod -n vite-react-shadcn-ts-dev | grep -A 20 "Events:" || echo "No pods found"
