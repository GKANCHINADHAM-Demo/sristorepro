name: 99 - Check Pod Status

on:
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  check:
    name: Check Status
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to spoke cluster
        run: |
          aws eks update-kubeconfig --name opsera-usw2-np --region us-west-2

      - name: Check pods
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n vite-react-shadcn-ts-dev

      - name: Check deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment vite-react-shadcn-ts -n vite-react-shadcn-ts-dev

      - name: Describe deployment
        run: |
          echo "=== Deployment Details ==="
          kubectl describe deployment vite-react-shadcn-ts -n vite-react-shadcn-ts-dev | tail -50

      - name: Check pod logs if any
        run: |
          echo "=== Pod Logs (if running) ==="
          kubectl logs -n vite-react-shadcn-ts-dev -l app=vite-react-shadcn-ts --tail=50 || echo "No logs available"

      - name: Check events
        run: |
          echo "=== Recent Events ==="
          kubectl get events -n vite-react-shadcn-ts-dev --sort-by='.lastTimestamp' | tail -20
