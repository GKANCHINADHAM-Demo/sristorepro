name: 99 - Update ArgoCD Destination to Spoke Cluster

on:
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  update:
    name: Update Destination
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to ArgoCD hub cluster
        run: |
          aws eks update-kubeconfig --name argocd-usw2 --region us-west-2

      - name: Apply updated ArgoCD application
        run: |
          echo "=== Applying updated ArgoCD application with spoke cluster destination ==="
          kubectl apply -f .opsera-vite_react_shadcn_ts/argocd/application-dev.yaml

      - name: Wait for application to process change
        run: |
          echo "Waiting 15 seconds for ArgoCD to process the change..."
          sleep 15

      - name: Verify destination updated
        run: |
          echo "=== Verifying ArgoCD application destination ==="
          kubectl get application vite-react-shadcn-ts-dev -n argocd -o jsonpath='{.spec.destination.server}' && echo ""

      - name: Check sync status
        run: |
          echo "=== ArgoCD Application Status ==="
          kubectl get application vite-react-shadcn-ts-dev -n argocd

      - name: Force sync to spoke cluster
        run: |
          echo "=== Forcing sync to spoke cluster ==="
          kubectl annotate application vite-react-shadcn-ts-dev -n argocd argocd.argoproj.io/refresh=hard --overwrite
